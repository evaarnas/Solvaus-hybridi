name: Android app

# Builds an installable Android APK (Tauri 2 mobile). The debug-signed APK can be
# sideloaded directly; see docs/ANDROID.md for release signing.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: "27.0.12077973"

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # The runner image already ships the Android SDK (ANDROID_HOME).
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nsrc-tauri -> src-tauri/target"

      - uses: taiki-e/install-action@v2
        with:
          # Keep the generated Android Gradle project on the known-good 8.14.5
          # wrapper. Newer Tauri CLI templates currently generate Gradle 9.6.1,
          # which has intermittently lost the generated buildSrc plugin jar in CI.
          tool: wasm-pack,tauri-cli@2.11.4

      - name: Verify generated frontend
        run: python tools/gen-index.py --check

      # Android refuses to update an app signed with a different key. Debug builds
      # otherwise get a fresh key on every runner, so keep one stable key in the cache.
      - name: Restore stable debug signing key
        id: debugkey
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Create debug signing key
        if: steps.debugkey.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Generate the Android project
        working-directory: src-tauri
        run: |
          cargo tauri android init --ci
          python ../tools/configure-android.py
          # Gullicube ships as a libgullicube.so executable; it must be extracted to disk to run.
          sed -i '0,/^android {/s//android {\n    packaging { jniLibs { useLegacyPackaging = true } }/' gen/android/app/build.gradle.kts
          grep -n -A1 '^android {' gen/android/app/build.gradle.kts

      - name: Build the APK
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          if ! cargo tauri android build --debug --features custom-protocol --apk --target aarch64 --target armv7; then
            # Gradle can occasionally cache an incomplete transformed buildSrc.jar;
            # the next invocation then can't load Tauri's generated RustPlugin.
            # Drop transformed artifacts and the generated project's config cache,
            # then retry once with a clean buildSrc plugin transform.
            rm -rf "$HOME"/.gradle/caches/*/transforms gen/android/.gradle/configuration-cache
            cargo tauri android build --debug --features custom-protocol --apk --target aarch64 --target armv7
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: solvaus-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
